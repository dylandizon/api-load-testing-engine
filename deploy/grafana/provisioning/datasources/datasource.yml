apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: postgres
    database: loadtesting
    secureJsonData:
      password: password
    jsonData:
      sslmode: disable
      timescaledb: true
      maxOpenConns: 20
      maxIdleConns: 10
      connMaxLifetime: 14400
    isDefault: true
